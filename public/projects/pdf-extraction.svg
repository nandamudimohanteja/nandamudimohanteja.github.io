<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Extracting Structured Data from PDFs">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#2a1318"/>
    </linearGradient>
    <linearGradient id="pdfFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b5b"/>
      <stop offset="1" stop-color="#d22f2f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg5)"/>

  <!-- PDF doc -->
  <g transform="translate(70,55)">
    <path d="M0 0 H120 L150 30 V180 H0 Z" fill="#0f1620" stroke="url(#pdfFill)" stroke-width="2"/>
    <path d="M120 0 V30 H150" fill="#0f1620" stroke="url(#pdfFill)" stroke-width="2"/>
    <!-- content lines -->
    <g stroke="#3a4a63" stroke-width="3" stroke-linecap="round">
      <path d="M16 50 H110"/>
      <path d="M16 68 H130"/>
      <path d="M16 86 H100"/>
      <path d="M16 104 H125"/>
      <path d="M16 122 H90"/>
      <path d="M16 140 H115"/>
      <path d="M16 158 H80"/>
    </g>
    <!-- PDF badge -->
    <g transform="translate(8,12)">
      <rect width="44" height="20" rx="4" fill="url(#pdfFill)"/>
      <text x="22" y="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#fff">PDF</text>
    </g>
  </g>

  <!-- arrow -->
  <g stroke="#ffb05b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M255 140 H320"/>
  </g>
  <polygon points="320,134 336,140 320,146" fill="#ffb05b"/>

  <!-- JSON output -->
  <g transform="translate(355,60)">
    <rect width="200" height="170" rx="8" fill="#0f1620" stroke="#5fb3a1" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="16" y="28" fill="#5fb3a1">{</text>
      <text x="32" y="50" fill="#9ecbff">"invoice"</text><text x="100" y="50" fill="#e6edf3">: "INV-9012",</text>
      <text x="32" y="72" fill="#9ecbff">"date"</text><text x="80" y="72" fill="#e6edf3">: "2025-08-14",</text>
      <text x="32" y="94" fill="#9ecbff">"total"</text><text x="86" y="94" fill="#e6edf3">: 1248.00,</text>
      <text x="32" y="116" fill="#9ecbff">"items"</text><text x="86" y="116" fill="#e6edf3">: [ ... ],</text>
      <text x="32" y="138" fill="#9ecbff">"vendor"</text><text x="92" y="138" fill="#e6edf3">: "Acme"</text>
      <text x="16" y="160" fill="#5fb3a1">}</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffe2c5">
    <text x="40" y="262" font-size="22" font-weight="700">Extracting Structured Data from PDFs</text>
    <text x="40" y="285" font-size="14" fill="#ffb05b">Python parser → JSON output</text>
  </g>
</svg>
