<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="ETL Data Pipeline using Airflow">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16223a"/>
    </linearGradient>
    <linearGradient id="boxE" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#017cee"/>
      <stop offset="1" stop-color="#11ace0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" fill="url(#bg2)"/>

  <!-- arrow line -->
  <g stroke="#3b8bd6" stroke-width="2" fill="none" stroke-dasharray="4 6" opacity="0.7">
    <path d="M120 130 H470"/>
  </g>

  <!-- Extract -->
  <g transform="translate(70,90)">
    <rect width="100" height="80" rx="10" fill="#0e1a2e" stroke="url(#boxE)" stroke-width="2"/>
    <text x="50" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="url(#boxE)">E</text>
    <text x="50" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ecbff">Extract</text>
  </g>

  <!-- Transform -->
  <g transform="translate(245,90)">
    <rect width="110" height="80" rx="10" fill="#0e1a2e" stroke="url(#boxE)" stroke-width="2"/>
    <text x="55" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="url(#boxE)">T</text>
    <text x="55" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ecbff">Transform</text>
  </g>

  <!-- Load -->
  <g transform="translate(430,90)">
    <rect width="100" height="80" rx="10" fill="#0e1a2e" stroke="url(#boxE)" stroke-width="2"/>
    <text x="50" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="url(#boxE)">L</text>
    <text x="50" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ecbff">Load</text>
  </g>

  <!-- arrows -->
  <g fill="#3b8bd6">
    <polygon points="170,125 185,130 170,135"/>
    <polygon points="355,125 370,130 355,135"/>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">
    <text x="40" y="244" font-size="24" font-weight="700">ETL Data Pipeline</text>
    <text x="40" y="270" font-size="16" fill="#9ecbff">orchestrated with Airflow → Data Warehouse</text>
  </g>
</svg>
