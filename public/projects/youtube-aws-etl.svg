<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="YouTube Trending ETL on AWS">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a0a"/>
      <stop offset="1" stop-color="#221316"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg3)"/>

  <!-- play button (YouTube) -->
  <g transform="translate(40,50)">
    <rect width="160" height="110" rx="22" fill="#ff0033"/>
    <polygon points="64,30 64,80 110,55" fill="#ffffff"/>
  </g>

  <!-- arrow -->
  <g stroke="#ff9900" stroke-width="3" fill="none">
    <path d="M215 105 H285" stroke-linecap="round"/>
  </g>
  <polygon points="285,99 300,105 285,111" fill="#ff9900"/>

  <!-- AWS services stack -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fff">
    <g transform="translate(320,40)">
      <rect width="240" height="36" rx="6" fill="#0e1117" stroke="#ff9900" stroke-width="1.5"/>
      <text x="14" y="23" fill="#ff9900" font-weight="700">S3</text>
      <text x="48" y="23" fill="#dfe2e6">raw + curated buckets</text>
    </g>
    <g transform="translate(320,90)">
      <rect width="240" height="36" rx="6" fill="#0e1117" stroke="#ff9900" stroke-width="1.5"/>
      <text x="14" y="23" fill="#ff9900" font-weight="700">Glue</text>
      <text x="58" y="23" fill="#dfe2e6">crawler + catalog</text>
    </g>
    <g transform="translate(320,140)">
      <rect width="240" height="36" rx="6" fill="#0e1117" stroke="#ff9900" stroke-width="1.5"/>
      <text x="14" y="23" fill="#ff9900" font-weight="700">Athena</text>
      <text x="78" y="23" fill="#dfe2e6">SQL on parquet</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffe2c5">
    <text x="40" y="240" font-size="24" font-weight="700">YouTube Trending ETL</text>
    <text x="40" y="268" font-size="16" fill="#ff9900">on AWS S3 · Glue · Athena</text>
  </g>
</svg>
